<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f0f0f0;min-height:100vh;}
.header{background:#E53935;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.header h1{font-size:18px;font-weight:600;flex:1;}
.notif-status{font-size:11px;opacity:0.8;cursor:pointer;background:rgba(255,255,255,0.15);padding:4px 8px;border-radius:4px;border:none;color:#fff;}
.toolbar{background:#fff;padding:10px 12px;border-bottom:1px solid #d0d0d0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.toolbar input[type=text]{flex:1;min-width:120px;padding:8px 10px;border:1px solid #b0b0b0;border-radius:4px;font-size:14px;}
.remind-cell.overdue{color:#c62828;font-weight:700;}
.task-notes{font-size:11px;color:#777;white-space:pre-wrap;margin-top:2px;}
#undo-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 14px;border-radius:10px;z-index:9997;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);}
#undo-bar button{background:#ffd54f;color:#333;border:0;border-radius:6px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer;}
.bulk-btn{font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid #ccc;background:#fff;color:#333;cursor:pointer;}
.bulk-btn.danger{background:#fdecea;color:#A32D2D;border-color:#f3b5b5;}
.bulk-btn:disabled{opacity:.45;cursor:default;}
tr.row-selected td{background:#dbe9ff !important;}
.cat-chip{font-size:12px;padding:4px 10px;border-radius:14px;border:1px solid #c8d6e5;background:#fff;color:#1a73e8;cursor:pointer;}
.cat-chip.active{background:#1a73e8;color:#fff;border-color:#1a73e8;}
.cat-badge{font-size:10px;background:#e3f2fd;color:#1a73e8;border-radius:3px;padding:1px 6px;margin-inline-start:4px;white-space:nowrap;}
.toolbar select{padding:8px 6px;border:1px solid #b0b0b0;border-radius:4px;font-size:13px;background:#fff;}
.toolbar input[type=date],.toolbar input[type=time]{padding:8px 6px;border:1px solid #b0b0b0;border-radius:4px;font-size:13px;}
.btn-add{background:#217346;color:#fff;border:none;border-radius:4px;padding:8px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-mic{background:#1a73e8;color:#fff;font-size:20px;padding:9px 14px;border-radius:4px;border:none;cursor:pointer;display:flex;align-items:center;}
.btn-mic.recording{background:#E24B4A;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
.mic-row{display:flex;align-items:center;gap:8px;width:100%;padding:2px 0;}
.mic-status{font-size:13px;color:#555;flex:1;}
.parsed-hint{font-size:12px;color:#217346;background:#e8f5e9;padding:3px 8px;border-radius:4px;display:none;margin-top:2px;}
.stats{background:#fff;padding:8px 12px;border-bottom:1px solid #d0d0d0;display:flex;gap:6px;flex-wrap:wrap;}
.stat{font-size:12px;padding:3px 10px;border-radius:3px;background:#f5f5f5;color:#555;}
.stat b{color:#222;}
.table-wrap{overflow-x:auto;padding:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid #b0b0b0;border-radius:4px;overflow:hidden;min-width:480px;}
thead tr{background:#217346;color:#fff;}
thead th{padding:9px 10px;text-align:right;font-weight:600;font-size:12px;border-right:1px solid #1a5c38;}
thead th:last-child{border-right:none;}
tbody tr{border-bottom:1px solid #d0d0d0;}
tbody tr:last-child{border-bottom:none;}
tbody td{padding:8px 10px;border-right:1px solid #e0e0e0;vertical-align:middle;}
tbody td:last-child{border-right:none;}
.row-high{background:#FCEBEB;}
.row-med{background:#FAEEDA;}
.row-low{background:#EAF3DE;}
.row-done{background:#f5f5f5;color:#999;}
.row-done .task-name{text-decoration:line-through;}
.pri-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;display:inline-block;}
.pri-high{background:#F7C1C1;color:#791F1F;}
.pri-med{background:#FAC775;color:#633806;}
.pri-low{background:#C0DD97;color:#27500A;}
.pri-done{background:#e0e0e0;color:#888;}
.status-wrap{display:flex;align-items:center;gap:5px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot-open{background:#E24B4A;}
.dot-done{background:#639922;}
.cb{width:15px;height:15px;cursor:pointer;}
.actions-cell{display:flex;align-items:center;gap:2px;}
.del-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:15px;padding:2px 4px;}
.del-btn:hover{color:#A32D2D;}
.cal-btn{background:none;border:none;cursor:pointer;color:#1a73e8;font-size:15px;padding:2px 4px;}
.cal-btn:hover{color:#0d47a1;}
.remind-cell{font-size:11px;color:#666;}
.row-num{color:#aaa;font-size:11px;text-align:center;}
.empty{text-align:center;padding:32px;color:#aaa;font-size:14px;}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:8px;padding:20px;width:90%;max-width:380px;direction:rtl;}
.modal h3{font-size:16px;color:#217346;margin-bottom:14px;}
.modal input,.modal select{width:100%;padding:8px 10px;border:1px solid #b0b0b0;border-radius:4px;font-size:14px;margin-bottom:10px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.btn-save{background:#217346;color:#fff;border:none;border-radius:4px;padding:8px 18px;font-size:14px;cursor:pointer;}
.btn-cancel{background:#fff;border:1px solid #b0b0b0;border-radius:4px;padding:8px 18px;font-size:14px;cursor:pointer;color:#555;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:80vw;text-align:center;}
.toast.show{opacity:1;}
.lists-bar{background:#fff;border-bottom:1px solid #d0d0d0;padding:8px 12px;display:flex;gap:6px;align-items:center;overflow-x:auto;white-space:nowrap;}
.list-tab{border:1px solid #b0b0b0;background:#f5f5f5;color:#333;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;flex-shrink:0;}
.list-tab.active{background:#E53935;border-color:#E53935;color:#fff;font-weight:600;}
.list-tab.add{background:#fff;color:#217346;border-style:dashed;border-color:#217346;}
.list-tools{display:flex;gap:6px;margin-inline-start:auto;flex-shrink:0;}
.list-tool{border:none;background:#e8f5e9;color:#217346;border-radius:4px;padding:5px 9px;font-size:12px;cursor:pointer;}
.list-tool.leave{background:#fdecea;color:#A32D2D;}
.list-members{font-size:12px;color:#666;padding:6px 12px;background:#fff;border-bottom:1px solid #d0d0d0;display:none;align-items:center;gap:8px;flex-wrap:wrap;}
.list-members-names{flex:1;min-width:120px;}

/* ══ עיצוב "תכל׳ס" – כחול לילה + קורל ══ */
:root{--navy:#1E1B4B;--coral:#FF5A5F;--bg:#F4F3FB;--ink:#1A1A2E;--muted:#5B5B76;--line:#E2E1F0;--soft:#C7C5F0;}
body{font-family:'Rubik',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);}
.app{max-width:640px;margin:0 auto;padding-bottom:40px;}
.hero{background:var(--navy);color:#fff;padding:16px 16px 58px;border-radius:0 0 28px 28px;}
.header{background:none;padding:0;gap:10px;}
.header .logo{width:40px;height:40px;border-radius:12px;flex-shrink:0;}
.brand{display:flex;flex-direction:column;flex:1;min-width:0;}
.header h1{font-size:23px;font-weight:800;letter-spacing:-.3px;line-height:1.1;flex:none;}
.brand small{font-size:12px;color:var(--soft);white-space:nowrap;}
.header{flex-wrap:wrap;row-gap:8px;}
.brand{flex:1 0 auto;}
.notif-status{font-size:12px;opacity:1;background:rgba(255,255,255,.12);padding:0 9px;height:40px;min-width:40px;border-radius:12px;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;font-family:inherit;}
.greet{margin-top:16px;}
.greet b{display:block;font-size:22px;font-weight:700;}
.greet span{font-size:14px;color:var(--soft);}
.toolbar{margin:-42px 12px 0;background:#fff;border:0;border-radius:22px;padding:16px;box-shadow:0 12px 30px rgba(30,27,75,.12);gap:10px;position:relative;}
.mic-row{gap:14px;}
.btn-mic{width:68px;height:68px;border-radius:50%;padding:0;justify-content:center;background:var(--coral);font-size:30px;box-shadow:0 0 0 7px #FFE4E5;flex-shrink:0;}
.btn-mic.recording{background:#E11D48;box-shadow:0 0 0 7px #FECDD3;}
.mic-status{font-size:14px;color:var(--muted);line-height:1.4;}
.mic-status::before{content:"לחץ ודבר";display:block;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:2px;}
.toolbar input[type=text]{height:46px;border:1.5px solid var(--line);border-radius:14px;background:#F8F8FD;font-size:16px;font-family:inherit;padding:0 14px;}
.toolbar select,.toolbar input[type=date],.toolbar input[type=time]{height:38px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:14px;font-family:inherit;color:var(--ink);flex:1;min-width:0;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
.btn-add{height:46px;border-radius:14px;background:var(--navy);font-family:inherit;font-size:15px;font-weight:600;padding:0 16px;}
.toolbar:has(.btn-mic.recording) .mic-status::before{content:"מקשיב…";color:#E11D48;}
.parsed-hint{background:#E7F8EF;color:#0F6B3E;border-radius:8px;}
.lists-bar,.list-members{background:transparent;border:0;padding:12px 12px 0;}
.list-tab{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:18px;height:36px;padding:0 14px;font-family:inherit;}
.list-tab.active{background:var(--navy);border-color:var(--navy);}
.list-tab.add{color:var(--navy);border-color:var(--navy);}
.list-tool{background:#ECEBFA;color:var(--navy);border-radius:10px;height:32px;font-family:inherit;}
.stats{background:transparent;border:0;padding:10px 12px 0;gap:8px;}
.stat{background:#fff;border-radius:10px;font-size:13px;padding:6px 10px;color:var(--muted);}
#cat-bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
#cat-bar .cat-chip{flex-shrink:0;}
.cat-chip{height:36px;padding:0 15px;border-radius:18px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-family:inherit;}
.cat-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;}
.bulk-btn{height:34px;border-radius:10px;border:1.5px solid var(--line);font-family:inherit;font-size:13px;}
#f-search{height:42px;border:1.5px solid var(--line)!important;border-radius:14px!important;font-size:15px!important;font-family:inherit;background:#fff;}
.task-list{padding:6px 12px 12px;display:flex;flex-direction:column;gap:8px;}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:10px 4px 0;letter-spacing:.2px;}
.sec.late{color:#B42318;}
.card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 12px 12px 6px;border:1.5px solid transparent;}
.card.late{border-color:#FDD3D0;}
.card.sel{border-color:#6366F1;background:#EEF0FF;}
.card.done{opacity:.6;}
.card.done .cname{text-decoration:line-through;}
.tick{width:28px;height:28px;border-radius:9px;border:2px solid #D0CFE3;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;cursor:pointer;padding:0;}
.tick.on{background:#10B981;border-color:#10B981;}
.cbody{flex:1;min-width:0;cursor:pointer;}
.cname{font-size:16px;font-weight:600;line-height:1.35;word-break:break-word;}
.cmeta{font-size:13px;color:var(--muted);margin-top:3px;}
.card.late .cmeta{color:#B42318;}
.pdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.p-high{background:#EF4444;}.p-med{background:#F59E0B;}.p-low{background:#A3A3C2;}
.cact{display:flex;flex-shrink:0;}
.cact button{background:none;border:0;color:#A3A3C2;font-size:18px;width:34px;height:40px;cursor:pointer;}
.cact button:hover{color:var(--navy);}
.cact button.del:hover{color:#B42318;}
.task-notes{color:var(--muted);}
.more-done{background:none;border:0;color:#4338CA;font-weight:600;font-size:14px;padding:8px 4px;cursor:pointer;font-family:inherit;text-align:start;}
.empty{background:#fff;border-radius:18px;}
.modal{border-radius:20px;}
.modal h3{color:var(--navy);}
.modal input,.modal select,.modal textarea{border-radius:12px!important;border:1.5px solid var(--line)!important;font-family:inherit;}
.btn-save{background:var(--navy);border-radius:12px;font-family:inherit;}
.btn-cancel{border-radius:12px;font-family:inherit;}
</style>
</head>
<body>

<div class="app">
<div class="hero">
<div class="header">
  <img class="logo" src="icon-v3-192.png" alt=""/>
  <div class="brand"><h1>תכל׳ס</h1><small>אמרת – זה נרשם</small></div>
  <button class="notif-status" id="notif-btn" onclick="requestNotify()">🔔 התראות</button>
  <button class="notif-status" id="gcal-status" onclick="gcalButton()">📅 חבר יומן</button>
  <button class="notif-status" id="stats-btn" onclick="showStats()" title="נתוני שימוש" style="display:none">📊</button>
  <button class="notif-status" id="logout-btn" onclick="logout()" title="התנתק" aria-label="התנתק" style="display:none"><i class="ti ti-logout"></i></button>
</div>
<div class="greet" id="greet"></div>
</div>

<div class="toolbar">
  <div class="mic-row">
    <button class="btn-mic" id="mic-btn" onclick="toggleMic()" aria-label="לחץ ודבר">
      <i class="ti ti-microphone" id="mic-icon"></i>
    </button>
    <div style="flex:1">
      <div class="mic-status" id="mic-status">"לקנות ביצים מחר ב-10 לבית" – והמשימה נרשמת לבד</div>
      <div class="parsed-hint" id="parsed-hint"></div>
    </div>
  </div>
  <div style="display:flex;gap:8px;width:100%">
    <input type="text" id="f-name" autocomplete="off" name="task-text" placeholder="או כתוב משימה..." onkeydown="if(event.key==='Enter')addTask()" style="flex:1"/>
    <button class="btn-add" onclick="addTask()" aria-label="הוסף"><i class="ti ti-plus"></i></button>
  </div>
  <div class="opts">
    <select id="f-pri">
      <option value="low" selected>⚪ לא דחוף</option>
      <option value="high">🔴 דחוף</option>
    </select>
    <select id="f-cat" onchange="onCatSelect(this)"></select>
    <input type="date" id="f-date"/>
    <input type="time" id="f-time"/>
  </div>
</div>

<div class="lists-bar" id="lists-bar"></div>
<div class="list-members" id="list-members"></div>
<div class="stats" id="cat-bar"></div>
<div class="stats"><input id="f-search" type="search" autocomplete="off" placeholder="🔍 חיפוש משימה..." oninput="render()" style="flex:1;min-width:120px;padding:6px 12px"></div>
<div class="stats" id="bulk-bar"></div>
<div class="task-list" id="tbl-body"></div>
<div class="stats" id="stats-bar"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
const TASKS_APP = firebase.initializeApp({
  apiKey:"AIzaSyA1Pq3qi361K9xDwv6v4Q44d_nLgpZBtRs",
  authDomain:"beit-habira.com", // קבצי ההתחברות מתארחים ב-beit-habira.com/__/auth - בלי זה התחברות Google לא עובדת באייפון (Safari חוסם)
  databaseURL:"https://orders-app-78c0f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"orders-app-78c0f",
  storageBucket:"orders-app-78c0f.firebasestorage.app",
  messagingSenderId:"1057881600020",
  appId:"1:1057881600020:web:2deed7103137123f6d7701"
}, 'staff-tasks'); // אפליקציה נפרדת - כדי שהתחברות המשימות לא תדרוס את ההתחברות של /retail או /orders
const db = TASKS_APP.database();
// בעל העסק (קוד מנהל) → todo/tasks כמו קודם. כל משתמש אחר (Google) → todo/users/<uid>/tasks, סביבה נפרדת
let tasksRef = db.ref('todo/tasks');
function refForUser(u){ return u.uid==='staff-tasks' ? db.ref('todo/tasks') : db.ref('todo/users/'+u.uid+'/tasks'); }
let tasks={}, recognition=null, isRecording=false, timers=[];
const GCAL_CLIENT_ID = '895106923239-7ctgh1gc0je4pah4egj0t8h2ajapo95c.apps.googleusercontent.com';
const GCAL_SCOPE = 'https://www.googleapis.com/auth/tasks';
if (localStorage.getItem('gcal_scope') !== GCAL_SCOPE) { localStorage.removeItem('gcal_token'); localStorage.removeItem('gcal_expiry'); }
let gcalToken = localStorage.getItem('gcal_token') || null;
let gcalExpiry = parseInt(localStorage.getItem('gcal_expiry') || '0');

let gcalSrv = {configured:false, connected:false, email:''};
function isGcalConnected() { return gcalSrv.configured ? gcalSrv.connected : (gcalToken && Date.now() < gcalExpiry); }
async function gcalServerApi(path, body){
  const idToken = await curUser.getIdToken();
  const r = await fetch(STAFF_API + '/tasks/gcal/' + path, {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + idToken}, body: JSON.stringify(body||{})});
  return r.json();
}
async function gcalServerStatus(){
  try {
    const j = await gcalServerApi('status');
    if (j && j.ok) { gcalSrv = {configured:!!j.configured, connected:!!j.connected, email:j.email||''}; updateGcalStatus(); if (gcalSrv.connected) syncMissingToGcal(); }
  } catch(e) {}
}
// פותח את חלון ההתחברות של גוגל (חייב להיפתח מיד בלחיצה, אחרת הדפדפן חוסם)
function gcalServerConnect(cb, win){
  const w = win || window.open('', 'gcal', 'width=520,height=680');
  gcalServerApi('start').then(j => {
    if (!j || !j.url) { if (w) w.close(); showToast((j && j.error) || 'החיבור נכשל'); return; }
    if (!w) { location.href = j.url; return; }
    w.location.href = j.url;
    let finished = false;
    const done = async () => { if (finished) return; await gcalServerStatus(); if (gcalSrv.connected) { finished = true; clearInterval(iv); cb && cb(); } };
    const iv = setInterval(() => { if (w.closed) { clearInterval(iv); done(); } }, 1000);
    const onVis = () => { if (document.visibilityState === 'visible') setTimeout(done, 800); };
    document.addEventListener('visibilitychange', onVis);
    setTimeout(() => { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); }, 10 * 60 * 1000);
  }).catch(() => { if (w) w.close(); showToast('אין חיבור לשרת'); });
}

function ensureGcalToken(callback) {
  if (isGcalConnected()) { callback(); return; }
  if (gcalSrv.configured) { gcalServerConnect(callback); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GCAL_CLIENT_ID,
    scope: GCAL_SCOPE,
    callback: (resp) => {
      if (resp.access_token) {
        gcalToken = resp.access_token;
        gcalExpiry = Date.now() + (resp.expires_in * 1000);
        localStorage.setItem('gcal_token', gcalToken);
        localStorage.setItem('gcal_expiry', String(gcalExpiry)); localStorage.setItem('gcal_scope', GCAL_SCOPE);
        updateGcalStatus();
        callback();
      }
    }
  });
  client.requestAccessToken({prompt: gcalToken ? '' : 'consent'});
}

// לחיצה על כפתור היומן: לא מחובר → חיבור. מחובר → אפשרות להחליף חשבון Google

// ── Google Tasks: כל משימה עם תאריך נכנסת כ"משימה" (עם וי) ביומן גוגל ──
// הערה: Google שומר למשימות רק תאריך דרך ה-API, לכן השעה נכתבת בתחילת הכותרת
function gcalClearToken(){
  gcalToken = null; gcalExpiry = 0;
  localStorage.removeItem('gcal_token'); localStorage.removeItem('gcal_expiry');
  updateGcalStatus();
}
function gtaskBody(task){
  return {
    title: task.name, // השעה לא בשם - היא בפרטי המשימה (Google לא שומר שעה במשימה מ-API)
    notes: (task.notes ? task.notes + '\n\n' : '') + 'נוסף מאפליקציית המשימות' + (task.time ? ' | שעה: ' + task.time : ''),
    due: task.date + 'T00:00:00.000Z',
    status: task.done ? 'completed' : 'needsAction'
  };
}
async function gtaskRequest(method, path, body){
  const r = await fetch('https://tasks.googleapis.com/tasks/v1/lists/@default/tasks' + (path||''), {
    method,
    headers: {'Authorization': 'Bearer ' + gcalToken, 'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined
  });
  const data = r.status === 204 ? {} : await r.json().catch(()=>({}));
  return {r, data};
}
function gtaskError(r, data){
  if (r.status === 401 || (r.status === 403 && /scope|insufficient/i.test(JSON.stringify(data)))) {
    gcalClearToken();
    return 'צריך להתחבר ליומן מחדש - לחץ "התחבר ליומן" ונסה שוב';
  }
  if (r.status === 403 && /has not been used|disabled|SERVICE_DISABLED/i.test(JSON.stringify(data)))
    return 'Google Tasks API לא מופעל בפרויקט ב-Google Cloud';
  return (data.error && data.error.message) || ('שגיאה ' + r.status);
}

// משימות שלא נכנסו ליומן (למשל כשהחיבור פג) נכנסות אוטומטית - רק פתוחות, מאתמול והלאה
let gcalSyncing=false;
function gcalSinceDate(){ const d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function syncMissingToGcal(){
  if(gcalSyncing) return; gcalSyncing=true;
  try{
    const since=gcalSinceDate();
    const list=Object.values(tasks).filter(t=>t&&t.date&&!t.done&&!t.gtaskId&&t.date>=since);
    let n=0;
    for(const t of list){ if(await addToGcal(t)===true) n++; }
    if(n) showToast(n+' משימות נוספו ליומן ✓');
  } finally { gcalSyncing=false; }
}
async function addToGcal(task) {
  if (!task.date) return;
  if (gcalSrv.configured) {
    const j = await gcalServerApi('task', {op:'create', task:{name:task.name, date:task.date, time:task.time||'', done:!!task.done, notes:task.notes||''}}).catch(e => ({ok:false, error:'אין חיבור לשרת'}));
    if (j.ok && j.id) { tasksRef.child(task.id).update(curList ? {gtaskId:j.id, gOwner:curUser.uid} : {gtaskId:j.id}); return true; }
    if (j.error === 'not_connected') { gcalSrv.connected = false; updateGcalStatus(); return 'צריך לחבר את היומן - לחץ 📅'; }
    return j.error || 'שגיאה';
  }
  try {
    const {r, data} = await gtaskRequest('POST', '', gtaskBody(task));
    if (data.id) {
      tasksRef.child(task.id).update(curList ? {gtaskId: data.id, gOwner: curUser.uid} : {gtaskId: data.id});
      return true;
    }
    return gtaskError(r, data);
  } catch(e) { console.error(e); return 'אין חיבור ליומן'; }
}

// עדכון/מחיקה של המשימה ביומן כשמשנים באפליקציה (בשקט, רק אם היומן מחובר)
async function syncGtask(task, remove){
  if (!task || !task.gtaskId || !isGcalConnected()) return;
  if (task.gOwner && curUser && task.gOwner !== curUser.uid) return; // משימה משותפת שנכנסה ליומן של מישהו אחר
  if (gcalSrv.configured) {
    gcalServerApi('task', remove ? {op:'delete', gtaskId:task.gtaskId} : {op:'update', gtaskId:task.gtaskId, task:{name:task.name, date:task.date, time:task.time||'', done:!!task.done, notes:task.notes||''}}).catch(()=>{});
    return;
  }
  try {
    const res = remove
      ? await gtaskRequest('DELETE', '/' + task.gtaskId)
      : await gtaskRequest('PATCH', '/' + task.gtaskId, gtaskBody(task));
    if (!res.r.ok && res.r.status !== 404) console.warn('gtask sync:', gtaskError(res.r, res.data));
  } catch(e) { console.error(e); }
}

// ── Hebrew parser ──
const HEB_NUMS = {'אחת עשרה':11,'אחד עשרה':11,'שתים עשרה':12,'שתיים עשרה':12,'אחת':1,'אחד':1,'שתיים':2,'שתים':2,'שלוש':3,'ארבע':4,'חמש':5,'שש':6,'שבע':7,'שמונה':8,'תשע':9,'עשר':10};
// מנרמל טקסט מדיבור: מספרים במילים → ספרות, 14.00 → 14:00, סימני כיוון נסתרים
function normalizeHebrewTime(text) {
  let s = String(text||'').replace(/[‎‏‪-‮]/g,'').replace(/[–־]/g,'-');
  const words = Object.keys(HEB_NUMS).sort((a,b)=>b.length-a.length).join('|');
  s = s.replace(new RegExp('(בשעה|שעה|ב-?)\\s*('+words+')(?:\\s+(וחצי|ורבע))?(?=\\s|$|[,.])','g'), (all,pre,w,frac)=>{
    const m = frac==='וחצי'?'30':frac==='ורבע'?'15':'00';
    return 'בשעה '+HEB_NUMS[w]+':'+m;
  });
  s = s.replace(/(בשעה|שעה|ב-?)\s*(\d{1,2})\.(\d{2})(?!\d)/g, 'בשעה $2:$3');
  s = s.replace(/(\d{1,2}):(\d{2})\s+(וחצי|ורבע)/g, '$1:$2');
  // שעה בלי "בשעה" לפניה (למשל "משימת בדיקה 3:42") - גם היא שעה ולא חלק מהשם
  s = s.replace(/(\d{1,2}):(\d{2})(?!\d)/g, (all,h,m,off,str)=> (/(בשעה|שעה|ב-?)\s*$/.test(str.slice(0,off)) || +h>23 || +m>59) ? all : 'בשעה '+h+':'+m);
  return s;
}

let pendingRep='';
function parseHebrewDateTime(text) {
  text = normalizeHebrewTime(text);
  let rep='';
  if (/כל\s+(?:יום\s+)?(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת)(?=\s|$|[,.])/.test(text)) { rep='weekly'; text=text.replace(/כל\s+(?:יום\s+)?(?=(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת))/,'ביום '); }
  else if (/כל\s+יום(?=\s|$|[,.])/.test(text)) { rep='daily'; text=text.replace(/כל\s+יום/,' '); }
  else if (/כל\s+שבוע(?=\s|$|[,.])/.test(text)) { rep='weekly'; text=text.replace(/כל\s+שבוע/,' '); }
  else if (/כל\s+חודש(?=\s|$|[,.])/.test(text)) { rep='monthly'; text=text.replace(/כל\s+חודש/,' '); }
  const now = new Date();
  let date = null, time = null;
  const days = {ראשון:0,שני:1,שלישי:2,רביעי:3,חמישי:4,שישי:5,שבת:6};

  if (/היום/.test(text)) date = new Date(now);
  if (/מחרתיים/.test(text)) { date=new Date(now); date.setDate(date.getDate()+2); }
  else if (/מחר/.test(text)) { date=new Date(now); date.setDate(date.getDate()+1); }

  const dowM = text.match(/(?:ביום|יום)\s+(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת)/);
  if (dowM) {
    const target=days[dowM[1]], curr=now.getDay();
    let diff=target-curr; if(diff<=0) diff+=7;
    date=new Date(now); date.setDate(date.getDate()+diff);
  }

  const dmatch = text.match(/(\d{1,2})[\/\.](\d{1,2})/);
  if (dmatch) date=new Date(now.getFullYear(), parseInt(dmatch[2])-1, parseInt(dmatch[1]));

  const tmatch = text.match(/(?:בשעה|שעה|ב-?)\s*(\d{1,2})(?::(\d{2}))?(?:\s*(בבוקר|בצהריים|אחה"צ|אחרי הצהריים|בערב|בלילה))?/);
  if (tmatch) {
    let h=parseInt(tmatch[1]), m=tmatch[2]?parseInt(tmatch[2]):0, p=tmatch[3]||'';
    if(p==='בצהריים'&&h<11) h+=12;
    if((p==='אחה"צ'||p==='אחרי הצהריים'||p==='בערב')&&h<12) h+=12;
    if(p==='בלילה'&&h<8) h+=12;
    // בלי "בבוקר": 1-6 נחשב אחה"צ (שעות עבודה בחנות)
    if(!p&&h>=1&&h<=6) h+=12;
    if(h>=0&&h<=23) time=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  }

  let clean = text;
  clean = clean.replace(/(?:ביום|יום)\s+(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת)/g,'');
  clean = clean.replace(/מחרתיים|מחר|היום/g,'');
  clean = clean.replace(/(?:בשעה|שעה|ב-?)\s*\d{1,2}(?::\d{2})?(?:\s*(?:בבוקר|בצהריים|אחה"צ|אחרי הצהריים|בערב|בלילה))?/g,'');
  clean = clean.replace(/\d{1,2}[\/\.]\d{1,2}/g,'');
  if (rep && !date) date = new Date(now);
  return {cleanText: clean.trim().replace(/\s+/g,' '), date, time, rep};
}

function applyParsed(parsed) {
  document.getElementById('f-name').value = parsed.cleanText;
  if (parsed.date) {
    const y=parsed.date.getFullYear(), mo=String(parsed.date.getMonth()+1).padStart(2,'0'), d=String(parsed.date.getDate()).padStart(2,'0');
    document.getElementById('f-date').value = y+'-'+mo+'-'+d;
  }
  if (parsed.time) document.getElementById('f-time').value = parsed.time;
  const hints=[];
  if (parsed.date) hints.push(parsed.date.toLocaleDateString('he-IL'));
  if (parsed.time) hints.push(parsed.time);
  pendingRep = parsed.rep || '';
  if (parsed.rep) hints.push({daily:'🔁 כל יום',weekly:'🔁 כל שבוע',monthly:'🔁 כל חודש'}[parsed.rep]);
  const hint=document.getElementById('parsed-hint');
  if (hints.length){hint.textContent='זוהה: '+hints.join(' ');hint.style.display='block';}
  else hint.style.display='none';
}

// ── Mic ──
let micGotFinal=false, micLastInterim='', micSilence=null, micMax=null, micErr=false;
const MIC_SILENCE_MS=2300; // שקט של כ-2 שניות = סיימת לדבר (הפסקה קצרה בין מילים לא עוצרת)
function micMerge(a,b){
  const A=(a||'').replace(/\s+/g,' ').trim(), B=(b||'').replace(/\s+/g,' ').trim();
  if(!A) return micDedupe(B); if(!B) return micDedupe(A);
  // השוואה בלי סימני פיסוק/מקפים (אנדרואיד שולח לפעמים "פינג-פונג" ואחר כך "פינג פונג")
  const N=x=>x.replace(/[-־.,!?״"'׳:;]/g,' ').replace(/\s+/g,' ').trim();
  const nA=N(A), nB=N(B);
  if(nB.startsWith(nA)) return micDedupe(B);           // תוצאה מצטברת - מחליפה
  if(nA===nB||nA.endsWith(nB)||nA.includes(nB)) return micDedupe(A); // כבר נאמר
  const aw=nA.split(' '), bw=nB.split(' '), bo=B.split(' ');
  let lcp=0; while(lcp<aw.length&&lcp<bw.length&&aw[lcp]===bw[lcp]) lcp++;
  if(lcp>=Math.max(1,Math.ceil(aw.length*0.6))) return micDedupe(bw.length>=aw.length?B:A); // אותו משפט שנשלח שוב (עם תיקון)
  for(let k=Math.min(aw.length,bw.length);k>0;k--){ // חפיפה בין סוף הקודם לתחילת החדש
    if(aw.slice(-k).join(' ')===bw.slice(0,k).join(' ')) return micDedupe(A+' '+bo.slice(k).join(' '));
  }
  return micDedupe(A+' '+B);
}
// "להכין תיק להכין תיק" -> "להכין תיק": מסיר רצף מילים שחוזר מיד פעמיים
function micDedupe(t){
  let w=String(t||'').replace(/\s+/g,' ').trim().split(' ');
  const N=x=>x.replace(/[-־.,!?״"'׳:;]/g,'');
  let changed=true;
  while(changed){ changed=false;
    for(let len=Math.floor(w.length/2);len>=2&&!changed;len--){
      for(let i=0;i+2*len<=w.length;i++){
        let same=true; for(let j=0;j<len;j++) if(N(w[i+j])!==N(w[i+len+j])){ same=false; break; }
        if(same){ w.splice(i+len,len); changed=true; break; }
      }
    }
  }
  return w.join(' ').trim();
}
function setupMic() {
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('mic-btn').style.opacity='0.4';document.getElementById('mic-status').textContent='הדפדפן לא תומך בהקלטה';return;}
  recognition=new SR();
  recognition.lang='he-IL'; recognition.continuous=true; recognition.interimResults=true; // נעצר רק אחרי שקט ממושך (למטה)
  recognition.onstart=()=>{
    isRecording=true; micGotFinal=false; micLastInterim=''; micErr=false; pendingRep='';
    clearTimeout(micSilence); clearTimeout(micMax);
    micMax=setTimeout(()=>{ if(isRecording) recognition.stop(); }, 15000); // הגנה: עד 15 שניות הקלטה
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('mic-icon').className='ti ti-microphone-off';
    document.getElementById('mic-status').textContent='מקשיב... דבר, והמשימה תתווסף לבד כשתסיים';
    document.getElementById('parsed-hint').style.display='none';
    document.getElementById('f-name').value='';
    document.getElementById('f-date').value='';
    document.getElementById('f-time').value='';
  };
  recognition.onresult=(e)=>{
    clearTimeout(micSilence);
    micSilence=setTimeout(()=>{ if(isRecording) recognition.stop(); }, MIC_SILENCE_MS);
    // כל מה שנאמר מתחילת ההקלטה (כמה משפטים/הפסקות) - מצטבר לטקסט אחד, ונקלט כשההקלטה נגמרת
    // באנדרואיד כל תוצאה מכילה לפעמים את כל מה שנאמר עד עכשיו - מאחדים חפיפות כדי לא לשכפל מילים
    let full='';
    for(let i=0;i<e.results.length;i++) full=micMerge(full,e.results[i][0].transcript);
    micLastInterim=full;
    document.getElementById('mic-status').textContent='מזהה: '+micLastInterim+'...';
  };
  recognition.onerror=(e)=>{ if(e.error==='aborted'||e.error==='no-speech') return; micErr=true;stopMic();document.getElementById('mic-status').textContent=e.error==='not-allowed'?'לא אושרה גישה למיקרופון':'שגיאה: '+e.error;};
  recognition.onend=()=>{
    clearTimeout(micSilence); clearTimeout(micMax);
    // בחלק מהטלפונים (במיוחד אייפון) לא מגיעה תוצאה "סופית" - משתמשים בתוצאה האחרונה
    if(!micGotFinal&&micLastInterim) applyParsed(parseHebrewDateTime(micLastInterim));
    const heard=(micGotFinal||micLastInterim)&&!micErr;
    stopMic();
    // הוספה אוטומטית - בלי ללחוץ "הוסף"
    if(heard && document.getElementById('f-name').value.trim()) addTask(true);
    else if(!micErr) document.getElementById('mic-status').textContent='לא נשמע כלום - לחץ על המיקרופון ונסה שוב';
  };
}

// ── Local notifications: task time + evening before ──
function scheduleLocal(t) {
  return; // התזכורות נשלחות עכשיו מהשרת (Push) - גם כשהאפליקציה סגורה. הקוד הישן נשאר למטה ללא שימוש
  if(!t.date || t.done || Notification.permission !== 'granted') return;
  const now = Date.now();

  // 1. Evening before (20:00 the day before)
  const dateParts = t.date.split('-').map(Number);
  const dayBefore = new Date(dateParts[0], dateParts[1]-1, dateParts[2]-1, 20, 0, 0);
  const msBefore = dayBefore.getTime() - now;
  if(msBefore > 0) {
    timers.push(setTimeout(()=>{
      new Notification('תזכורת למחר: ' + t.name, {
        body: 'מחר' + (t.time ? ' בשעה ' + t.time : ''),
        icon: '/tasks/icon-v3-192.png', dir: 'rtl', requireInteraction: true
      });
    }, msBefore));
  }

  // 2. At task time (if time set)
  if(t.time) {
    const taskTime = new Date(t.date + 'T' + t.time).getTime();
    const msTask = taskTime - now;
    if(msTask > 0) {
      timers.push(setTimeout(()=>{
        new Notification('הגיע הזמן: ' + t.name, {
          body: 'עכשיו!',
          icon: '/tasks/icon-v3-192.png', dir: 'rtl', requireInteraction: true
        });
      }, msTask));
    }
  }
}

function scheduleAllLocal() {
  timers.forEach(clearTimeout); timers=[];
  Object.values(tasks).forEach(scheduleLocal);
}

let curUser=null, curList=null, myLists={}, listsRef=null, listMetaRefs={};
function listTasksRef(id){ return id ? db.ref('todo/shared/'+id+'/tasks') : refForUser(curUser); }
function subscribeTasks(){
  let firstLoad=true;
  tasksRef.on('value',snap=>{tasks=snap.val()||{};render(); if(firstLoad){ firstLoad=false; if(!curList && isGcalConnected()) syncMissingToGcal(); } }, ()=>{

function switchList(id){

}
function watchLists(){
  listsRef=db.ref('todo/userLists/'+curUser.uid);
  listsRef.on('value', snap=>{
    const ids=Object.keys(snap.val()||{});
    Object.keys(listMetaRefs).forEach(id=>{ if(!ids.includes(id)){ listMetaRefs[id].off(); delete listMetaRefs[id]; delete myLists[id]; } });
    ids.forEach(id=>{
      if(listMetaRefs[id]) return;
      myLists[id]={name:'...'};
      const r=db.ref('todo/shared/'+id); listMetaRefs[id]=r;
      // קוראים רק שם/חברים/קוד הזמנה (לא את כל המשימות) לכל רשימה
      ['name','members','invite'].forEach(k=>r.child(k).on('value', s=>{ if(myLists[id]){ myLists[id][k]=s.val(); renderLists(); } }, ()=>{}));
    });

function addTask(auto){
  let name=document.getElementById('f-name').value.trim();
  if(!name)return;
  // מזהה תאריך/שעה גם בטקסט שהוקלד או הוכתב דרך המקלדת, ומוציא אותם משם המשימה
  let date=document.getElementById('f-date').value, time=document.getElementById('f-time').value;
  const parsed=parseHebrewDateTime(name);
  const repParsed=parsed.rep||pendingRep||''; pendingRep='';
  if((parsed.date||parsed.time)&&parsed.cleanText){
    name=parsed.cleanText;
    if(!date&&parsed.date){const d=parsed.date;date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    if(!time&&parsed.time) time=parsed.time;
  }
  if(time&&!date){const d=new Date();date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  // קטגוריה מתוך המשפט: "לקנות ביצים לבית" → משימה "לקנות ביצים" בקטגוריה בית (רק בסוף המשפט, עם ל/ב)
  let autoCat='';
  const fcSel=document.getElementById('f-cat');
  if(!(fcSel&&fcSel.value&&fcSel.value!=='__new')){
    // סדר עדיפות: "קטגוריה עבודה" בכל מקום ← "...לבית" בסוף ← "לבית ..." בהתחלה ← "...לבית..." באמצע (לא לפני "של")
    const cats=allCats().slice().sort((a,b)=>b.length-a.length).map(c=>[c,c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')]);
    const tries=[
      e=>new RegExp('(^|\\s)(?:ב|ל)?קטגוריי?ה\\s+'+e+'(?=\\s|$)'),
      e=>new RegExp('(\\s)(?:ל|ב)'+e+'$'),
      e=>new RegExp('^()(?:ל|ב)'+e+'(?=\\s)'),
      e=>new RegExp('(\\s)(?:ל|ב)'+e+'(?=\\s)(?!\\s+של(?:\\s|$))')
    ];
    outer: for(const mk of tries){
      for(const [c,e] of cats){
        const re=mk(e);
        if(re.test(name)){ const rest=name.replace(re,'$1').replace(/\s+/g,' ').trim(); if(rest){ name=rest; autoCat=c; break outer; } }
      }
    }
  }
  let autoPri='';
  // דחיפות מהמשפט: "דחוף" / "דחיפות גבוהה|בינונית|נמוכה" / "עדיפות ..." / "לא דחוף" / בסוף המשפט גם "חשוב", "בינוני", "נמוך"
  const PRI_RULES=[
    [/(^|\s)(?:ב)?(?:דחיפות|עדיפות)\s+(?:גבוהה|עליונה)(?=\s|$)/,'high'],
    [/(^|\s)(?:ב)?(?:דחיפות|עדיפות)\s+(?:בינונית|רגילה)(?=\s|$)/,'low'],
    [/(^|\s)(?:ב)?(?:דחיפות|עדיפות)\s+נמוכה(?=\s|$)/,'low'],
    [/(^|\s)(?:לא\s+דחוף|לא\s+בוער|לא\s+חשוב|מתי\s+שיש\s+זמן)(?=\s|$)/,'low'],
    [/(^|\s)(?:דחוף\s+מאוד|דחוף|בדחיפות|בוער)(?=\s|$)/,'high'],
    [/(\s)(?:חשוב\s+מאוד|חשוב)$/,'high'],
    [/(\s)(?:בינוני|רגיל)$/,'low'],
    [/(\s)נמוך$/,'low']
  ];
  for(const [re,p] of PRI_RULES){ if(re.test(name)&&name.replace(re,'$1').trim()){ autoPri=p; name=name.replace(re,'$1'); break; } }
  name=name.replace(/\s+/g,' ').trim(); if(!name) return;
  const id='task_'+Date.now();
  const task={id,name,pri:document.getElementById('f-pri').value,date,time,done:false,created:Date.now()};
  const fc=document.getElementById('f-cat'); if(fc&&fc.value&&fc.value!=='__new') task.cat=fc.value; else if(autoCat) task.cat=autoCat;
  if(curList && curUser) task.by=(myLists[curList]&&myLists[curList].members&&myLists[curList].members[curUser.uid]&&myLists[curList].members[curUser.uid].name)||'';
  if(autoPri && document.getElementById('f-pri').value!=='high') task.pri=autoPri; // בחירה ידנית של "דחוף" גוברת
  if(repParsed){ task.rep=repParsed; if(!task.date){ const d=new Date(); task.date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); } }
  tasksRef.child(id).set(task);
  if(curList) listsApi('notify',{listId:curList,name:task.name}).catch(()=>{}); // התראה לשאר חברי הרשימה
  statsApi('event',{type: auto===true ? 'task_voice' : 'task_typed'});
  document.getElementById('f-name').value='';
  document.getElementById('f-date').value='';
  document.getElementById('f-time').value='';
  document.getElementById('parsed-hint').style.display='none';
  document.getElementById('mic-status').textContent=auto===true?'נוסף: '+name+' — לחץ שוב למשימה נוספת':'"לקנות ביצים מחר ב-10 לבית" – והמשימה נרשמת לבד';
  if(auto!==true) document.getElementById('f-name').focus();
  if (task.date && auto===true && !isGcalConnected()) {
    showToast('המשימה נוספה ✓ — לחץ 📅 כדי להכניס אותה ליומן');
  } else if (task.date) {
    ensureGcalToken(async () => {
      const added = await addToGcal(task);
      showToast(added === true ? 'נוסף כמשימה ביומן גוגל! ✓' : 'המשימה נוספה, אבל לא ליומן: ' + added);
    });
  } else {
    showToast('משימה נוספה!');
  }
  scheduleLocal(task);
}

function toggle(id){const t0=tasks[id];if(t0){
  const t={...t0}; const needNext=!t.done&&t.rep&&!t.nextMade; // נבדק לפני העדכון
  const upd={done:!t.done}; if(needNext) upd.nextMade=true;
  tasksRef.child(id).update(upd);syncGtask({...t,done:!t.done});
  if(needNext) createNextRepeat(t);
}}
function nextRepeatDate(t){
  const today=new Date(); today.setHours(0,0,0,0);
  const d=t.date?new Date(t.date+'T00:00'):new Date(today);
  const step=()=>{ if(t.rep==='daily') d.setDate(d.getDate()+1); else if(t.rep==='weekly') d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1); };
  step(); let guard=0; while(d<today && guard++<400) step();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function createNextRepeat(t){
  const nid='task_'+Date.now();
  const n={id:nid,name:t.name,pri:t.pri==='high'?'high':'low',date:nextRepeatDate(t),time:t.time||'',done:false,created:Date.now(),rep:t.rep};
  if(t.cat) n.cat=t.cat; if(t.notes) n.notes=t.notes; if(t.by) n.by=t.by;
  tasksRef.child(nid).set(n);
  if(isGcalConnected()) addToGcal(n);
  showToast('🔁 נוצרה המשימה הבאה: '+n.date.split('-').reverse().join('/'));
}
function del(id){ deleteWithUndo([id]); }
let undoTimer=null, undoData=null;
function deleteWithUndo(ids){
  ids=ids.filter(id=>tasks[id]); if(!ids.length) return;
  finalizeUndo();
  const removed={}; ids.forEach(id=>{ removed[id]={...tasks[id]}; });
  const upd={}; ids.forEach(id=>{ upd[id]=null; });
  const ref=tasksRef;
  ref.update(upd).then(()=>{
    undoData={ref, removed};
    showUndo(ids.length===1?'המשימה נמחקה':ids.length+' משימות נמחקו');
    undoTimer=setTimeout(finalizeUndo, 7000);
  }).catch(e=>{ showToast('המחיקה נכשלה'); console.error(e); });
}
// אחרי 7 שניות בלי "בטל" - נמחקת סופית גם מ-Google Tasks
function finalizeUndo(){ clearTimeout(undoTimer); undoTimer=null; if(undoData){ Object.values(undoData.removed).forEach(t=>syncGtask(t,true)); undoData=null; } hideUndo(); }
function undoDelete(){ clearTimeout(undoTimer); undoTimer=null; if(!undoData) return; const d=undoData; undoData=null; hideUndo(); d.ref.update(d.removed).then(()=>showToast('שוחזר ✓')).catch(()=>showToast('השחזור נכשל')); }
function showUndo(msg){ hideUndo(); const b=document.createElement('div'); b.id='undo-bar'; b.innerHTML='<span></span><button>בטל</button>'; b.querySelector('span').textContent=msg; b.querySelector('button').onclick=undoDelete; document.body.appendChild(b); }
function hideUndo(){ document.getElementById('undo-bar')?.remove(); }

const priLabel={high:'דחוף',med:'לא דחוף',low:'לא דחוף'}; // שתי רמות: דחוף / לא דחוף (משימות ישנות 'בינוני' = לא דחוף)

// ── קטגוריות (בית / עבודה / מכירות + קטגוריות שהמשתמש מוסיף) ──
const DEFAULT_CATS=['בית','עבודה','מכירות'];
let curCat=''; try{ curCat=localStorage.getItem('tasks_cur_cat')||''; }catch(e){}
const escCat=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let extraCats=[]; try{ extraCats=JSON.parse(localStorage.getItem('tasks_extra_cats')||'[]'); }catch(e){}
function allCats(){ const s=new Set(DEFAULT_CATS); extraCats.forEach(c=>s.add(c)); Object.values(tasks).forEach(t=>t&&t.cat&&s.add(t.cat)); return [...s]; }
function catOptions(sel){ return '<option value="">📂 ללא קטגוריה</option>'+allCats().map(c=>'<option value="'+escCat(c)+'"'+(c===sel?' selected':'')+'>'+escCat(c)+'</option>').join('')+'<option value="__new">➕ קטגוריה חדשה...</option>'; }
function onCatSelect(sel){
  if(sel.value!=='__new') return;
  const n=(prompt('שם הקטגוריה החדשה:')||'').trim().slice(0,20);
  if(!n){ sel.value=''; return; }
  if(!extraCats.includes(n)){ extraCats.push(n); try{ localStorage.setItem('tasks_extra_cats',JSON.stringify(extraCats)); }catch(e){} }
  sel.innerHTML=catOptions(n); sel.value=n; renderCats();
}
function setCat(c){ curCat=c; try{ localStorage.setItem('tasks_cur_cat',c); }catch(e){} const fc=document.getElementById('f-cat'); if(fc) fc.value=c; render(); }
function renderCats(){
  const fc=document.getElementById('f-cat');
  if(fc){ const v=fc.value||curCat; fc.innerHTML=catOptions(v); fc.value=allCats().includes(v)?v:''; }
  const bar=document.getElementById('cat-bar'); if(!bar) return;
  const open=c=>Object.values(tasks).filter(t=>t&&!t.done&&(c===null||(t.cat||'')===c)).length;
  bar.innerHTML='<button class="cat-chip'+(!curCat?' active':'')+'" onclick="setCat(\'\')">הכל ('+open(null)+')</button>'
    +allCats().map(c=>'<button class="cat-chip'+(curCat===c?' active':'')+'" data-c="'+escCat(c)+'">'+escCat(c)+' ('+open(c)+')</button>').join('');
  bar.querySelectorAll('button[data-c]').forEach(b=>b.onclick=()=>setCat(b.getAttribute('data-c')));
}
// ── מחיקה של כמה משימות יחד ──
let selectMode=false, showDone=false; const selected=new Set();
function rowClick(id){ if(selectMode) toggleSel(id); else editTask(id); }
function toggleSel(id){ selected.has(id)?selected.delete(id):selected.add(id); render(); }
function setSelectMode(on){ selectMode=on; selected.clear(); render(); }
function selectAllVisible(){ const vis=Object.values(tasks).filter(t=>t&&(!curCat||(t.cat||'')===curCat)); const all=vis.every(t=>selected.has(t.id)); vis.forEach(t=>all?selected.delete(t.id):selected.add(t.id)); render(); }
async function bulkDelete(ids){
  ids=ids.filter(id=>tasks[id]); if(!ids.length) return;
  if(ids.length>1 && !confirm('למחוק '+ids.length+' משימות?')) return;
  selected.clear(); selectMode=false;
  deleteWithUndo(ids); render();
}
function renderBulk(){
  const bar=document.getElementById('bulk-bar'); if(!bar) return;
  const vis=Object.values(tasks).filter(t=>t&&(!curCat||(t.cat||'')===curCat));
  const doneIds=vis.filter(t=>t.done).map(t=>t.id);
  if(!vis.length){ bar.style.display='none'; return; } bar.style.display='';
  if(!selectMode){
    bar.innerHTML='<button class="bulk-btn" onclick="setSelectMode(true)">☑ בחירה מרובה</button>'
      +(doneIds.length?'<button class="bulk-btn danger" id="del-done">🗑 מחק בוצעו ('+doneIds.length+')</button>':'');
    const dd=document.getElementById('del-done'); if(dd) dd.onclick=()=>bulkDelete(doneIds);
  } else {
    bar.innerHTML='<span class="stat">נבחרו: <b>'+selected.size+'</b></span>'
      +'<button class="bulk-btn" onclick="selectAllVisible()">בחר הכל</button>'
      +'<button class="bulk-btn danger" '+(selected.size?'':'disabled')+' onclick="bulkDelete([...selected])">🗑 מחק נבחרות</button>'
      +'<button class="bulk-btn" onclick="setSelectMode(false)">ביטול</button>';
  }
}
function render(){
  renderCats(); renderBulk();
  const q=((document.getElementById('f-search')||{}).value||'').trim().toLowerCase();
  const due=t=>t.date?new Date(t.date+'T'+(t.time||'23:59')).getTime():Infinity;
  const nowMs=Date.now();
  // פתוחות קודם; בתוכן - לפי תאריך ושעה (הקרובה ראשונה, בלי תאריך בסוף); אחר כך לפי דחיפות
  const list=Object.values(tasks).filter(t=>t&&(!curCat||(t.cat||'')===curCat)&&(!q||(String(t.name||'')+' '+String(t.notes||'')).toLowerCase().includes(q))).sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    const da=due(a), db=due(b); if(da!==db) return da-db;
    const p={high:0,med:1,low:1};return (p[a.pri]??1)-(p[b.pri]??1);
  });
  const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const today=dk(new Date()), tmr=dk(new Date(Date.now()+864e5)), yst=dk(new Date(Date.now()-864e5));
  const isLate=t=>!t.done&&t.date&&due(t)<nowMs;
  const dayTxt=t=>!t.date?'':t.date===today?'היום':t.date===tmr?'מחר':t.date===yst?'אתמול':new Date(t.date+'T12:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'});
  const repTxt={daily:'כל יום',weekly:'כל שבוע',monthly:'כל חודש'};
  const card=t=>{
    const late=isLate(t);
    const meta=[(!t.done&&t.pri==='high')?'<b style="color:#DC2626">דחוף</b>':'', late?'באיחור':'', [t.date&&t.date!==today?dayTxt(t):'', t.time||''].filter(Boolean).join(' '), (t.cat&&!curCat)?esc(t.cat):'', t.rep?'🔁 '+(repTxt[t.rep]||''):'', (curList&&t.by)?esc(t.by):''].filter(Boolean).join(' · ');
    const sel=selectMode&&selected.has(t.id);
    return '<div class="card'+(t.done?' done':'')+(late?' late':'')+(sel?' sel':'')+'">'
      +(selectMode
        ?'<button class="tick'+(sel?' on':'')+'" aria-label="בחר" onclick="toggleSel(\''+t.id+'\')">'+(sel?'✓':'')+'</button>'
        :'<button class="tick'+(t.done?' on':'')+'" aria-label="'+(t.done?'סמן כפתוחה':'סמן כבוצעה')+'" onclick="toggle(\''+t.id+'\')">'+(t.done?'✓':'')+'</button>')
      +'<div class="cbody" onclick="rowClick(\''+t.id+'\')" title="לחץ לעריכה"><div class="cname">'+esc(t.name)+'</div>'
      +(meta?'<div class="cmeta">'+meta+'</div>':'')
      +(t.notes?'<div class="task-notes">📝 '+esc(String(t.notes).slice(0,80))+(String(t.notes).length>80?'…':'')+'</div>':'')+'</div>'
      +(!t.done&&t.pri==='high'?'<span class="pdot p-high" title="דחוף"></span>':'')
      +(selectMode?'':'<div class="cact"><button onclick="moveTask(\''+t.id+'\')" title="העבר לרשימה אחרת" aria-label="העבר לרשימה אחרת"><i class="ti ti-arrows-exchange"></i></button><button class="del" onclick="del(\''+t.id+'\')" title="מחק" aria-label="מחק"><i class="ti ti-trash"></i></button></div>')
      +'</div>';
  };
  const open=list.filter(t=>!t.done), doneL=list.filter(t=>t.done);
  const groups=[['באיחור',open.filter(isLate),'late'],['היום',open.filter(t=>!isLate(t)&&t.date===today),''],['מחר',open.filter(t=>t.date===tmr),''],['בהמשך',open.filter(t=>t.date&&t.date>tmr),''],['בלי תאריך',open.filter(t=>!t.date),'']];
  let html='';
  groups.forEach(([title,arr,cls])=>{ if(arr.length) html+='<div class="sec '+cls+'">'+title+'</div>'+arr.map(card).join(''); });
  if(doneL.length){
    if(showDone||q||selectMode) html+='<div class="sec">בוצעו</div>'+doneL.map(card).join('')+(q||selectMode?'':'<button class="more-done" onclick="showDone=false;render()">הסתר משימות שבוצעו</button>');
    else html+='<button class="more-done" onclick="showDone=true;render()">'+doneL.length+' משימות שבוצעו ←</button>';
  }
  document.getElementById('tbl-body').innerHTML = list.length ? html : '<div class="empty">אין משימות — לחץ על המיקרופון ותגיד את הראשונה!</div>';
  const g=document.getElementById('greet');
  if(g){
    const h=new Date().getHours(), hi=h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב';
    const nm=curUser?(curUser.uid==='staff-tasks'?'רני':String(curUser.displayName||'').split(' ')[0]):'';
    const all=Object.values(tasks).filter(t=>t&&!t.done), nT=all.filter(t=>t.date===today&&!isLate(t)).length, nL=all.filter(isLate).length;
    const A=accessInfo, trialNote=(A&&A.allowed&&A.until!=null&&A.daysLeft<=3)?'<div style="margin-top:8px;display:inline-block;background:rgba(255,90,95,.18);color:#FFD7D8;border-radius:10px;padding:5px 10px;font-size:13px">⏳ '+(A.plan==='paid'?'המנוי נגמר':'הניסיון נגמר')+(A.daysLeft<=1?' מחר':' בעוד '+A.daysLeft+' ימים')+'</div>':'';
    g.innerHTML='<b>'+hi+(nm?', '+esc(nm):'')+'</b><span>'+(nT?nT+' משימות להיום':'אין משימות להיום')+(nL?' · '+nL+' באיחור':'')+'</span>'+trialNote;
  }
  const total=list.length,done=list.filter(t=>t.done).length,urgent=list.filter(t=>t.pri==='high'&&!t.done).length;
  document.getElementById('stats-bar').innerHTML=
    '<span class="stat">סה"כ: <b>'+total+'</b></span>'+
    '<span class="stat">בוצעו: <b>'+done+'</b></span>'+
    '<span class="stat">פתוחות: <b>'+(total-done)+'</b></span>'+
    '<span class="stat" style="color:#A32D2D">דחופות: <b>'+urgent+'</b></span>'+
    '<span class="stat">התקדמות: <b>'+(total?Math.round(done/total*100):0)+'%</b></span>';
  scheduleAllLocal();
}

function editTask(id) {
  const t = tasks[id];
  if(!t) return;
  // Remove existing modal
  document.getElementById('edit-modal')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'edit-modal';
  overlay.innerHTML = `
    <div class="modal">
      <h3>ערוך משימה</h3>
      <input type="text" id="e-name" value="${t.name}" placeholder="שם המשימה"/>
      <select id="e-pri">
        <option value="low" ${t.pri!=='high'?'selected':''}>⚪ לא דחוף</option>
        <option value="high" ${t.pri==='high'?'selected':''}>🔴 דחוף</option>
      </select>
      <select id="e-cat" onchange="onCatSelect(this)">${catOptions(t.cat||'')}</select>
      <input type="date" id="e-date" value="${t.date||''}"/>
      <input type="time" id="e-time" value="${t.time||''}"/>
      <select id="e-rep"><option value="">🔁 לא חוזרת</option><option value="daily">🔁 כל יום</option><option value="weekly">🔁 כל שבוע</option><option value="monthly">🔁 כל חודש</option></select>
      <textarea id="e-notes" rows="4" placeholder="📝 פרטים נוספים (כתובת, טלפון, מה להביא...)" style="width:100%;padding:8px 10px;border:1px solid #b0b0b0;border-radius:4px;font-size:14px;margin-bottom:10px;font-family:inherit;resize:vertical"></textarea>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="document.getElementById('edit-modal').remove()">ביטול</button>
        <button class="btn-save" onclick="saveEdit('${id}')">שמור</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
  document.getElementById('e-name').value = t.name || '';
  document.getElementById('e-notes').value = t.notes || '';
  document.getElementById('e-rep').value = t.rep || '';
  document.getElementById('e-name').focus();
}

function saveEdit(id) {
  const name = document.getElementById('e-name').value.trim();
  if(!name) return;
  const upd = {
    name, pri: document.getElementById('e-pri').value,
    date: document.getElementById('e-date').value,
    time: document.getElementById('e-time').value,
    cat: (document.getElementById('e-cat').value==='__new'?'':document.getElementById('e-cat').value),
    notes: document.getElementById('e-notes').value.trim().slice(0,2000),
    rep: document.getElementById('e-rep').value
  };
  if (upd.rep && !upd.date) { const d=new Date(); upd.date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  tasksRef.child(id).update(upd);
  if (tasks[id] && tasks[id].gtaskId && upd.date) syncGtask({...tasks[id], ...upd});
  document.getElementById('edit-modal').remove();
  showToast('משימה עודכנה!');
  scheduleAllLocal();
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
updateGcalStatus();
iosInstallHint();
// עדכון אוטומטי: כשחוזרים לאפליקציה (גם מהמסך הבית) ויש גרסה חדשה באתר - נטענת לבד. לא באמצע הקלטה/עריכה/הקלדה
const APP_VERSION='2026-10-27z';
async function checkAppUpdate(){
  try{
    const t=await fetch('/tasks/?v='+Date.now(),{cache:'no-store'}).then(r=>r.text());
    const m=t.match(/const APP_VERSION='([^']+)'/);
    if(m && m[1]!==APP_VERSION && !isRecording && !document.getElementById('edit-modal') && !document.getElementById('f-name').value) location.reload();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ checkAppUpdate(); checkAccess(); } });
if('serviceWorker' in navigator) navigator.serviceWorker.register('/tasks/sw-push.js', {scope: '/tasks/'}).catch(()=>{});
